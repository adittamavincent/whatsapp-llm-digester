[project]
name = "whatsapp-digester-ocr"
version = "0.1.0"
description = "Isolated PaddleOCR-VL document parsing environment"
requires-python = ">=3.12,<3.14"
dependencies = [
  "paddleocr[doc-parser]>=3.7,<4",
  "paddlepaddle>=3.3.1,<4",
]

[project.optional-dependencies]
metal = ["mlx-vlm>=0.6.1,<1"]

[tool.uv]
package = false
